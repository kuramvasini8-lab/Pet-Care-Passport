<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - PetCare Passport</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body style="background:var(--slate-100);display:flex;flex-direction:column;min-height:100vh;">

  <!-- Simple Header -->
  <nav class="navbar" style="background:#ffffff;">
    <div class="container nav-inner">
      <a href="/index.html" class="brand-logo">
        <span class="logo-icon">🐾</span>
        <span>PetCare<span style="color:var(--primary-600);">Passport</span></span>
      </a>
      <div>
        <a href="/login.html" class="btn btn-outline btn-sm">Already registered? Log In</a>
      </div>
    </div>
  </nav>

  <main class="container" style="display:flex;align-items:center;justify-content:center;flex:1;padding:40px 16px;">
    <div class="card" style="max-width:500px;width:100%;box-shadow:var(--shadow-xl);padding:36px;">
      
      <div style="text-align:center;margin-bottom:28px;">
        <span style="font-size:2.5rem;">🐾</span>
        <h1 style="font-size:1.8rem;margin-top:8px;">Create Your Account</h1>
        <p class="text-muted" style="font-size:0.9rem;margin-top:4px;">
          One unified account to manage pets, track veterinary care, and apply for pet adoptions.
        </p>
      </div>

      <form id="register-form" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name *</label>
          <input type="text" id="reg-name" class="form-control" required placeholder="e.g. Alex Taylor">
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address *</label>
          <input type="email" id="reg-email" class="form-control" required placeholder="name@example.com">
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-phone">Contact Phone (Optional)</label>
          <input type="tel" id="reg-phone" class="form-control" placeholder="+1 (555) 000-0000">
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Password (Minimum 6 characters) *</label>
          <input type="password" id="reg-password" class="form-control" required minlength="6" placeholder="Choose a secure password">
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%;height:46px;margin-top:8px;" id="btn-submit-reg">
          Create Account & Start 🚀
        </button>
      </form>

      <div style="text-align:center;margin-top:24px;font-size:0.875rem;color:var(--slate-500);">
        Already have an account? <a href="/login.html" style="font-weight:600;">Sign in here</a>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    async function handleRegister(e) {
      e.preventDefault();
      const full_name = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value;
      const phone = document.getElementById('reg-phone').value;
      const password = document.getElementById('reg-password').value;
      const btn = document.getElementById('btn-submit-reg');

      btn.disabled = true;
      btn.textContent = 'Creating Account...';

      try {
        const res = await API.post('/api/auth/register', { full_name, email, phone, password });
        showToast('Registration successful! Welcome to PetCare Passport.', 'success');

        setTimeout(() => {
          window.location.href = '/owner/dashboard.html';
        }, 600);
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Create Account & Start 🚀';
      }
    }
  </script>
</body>
</html>
