<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Pet Passport - Emergency ID</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/passport.css">
</head>
<body style="background:var(--slate-100);">

  <!-- Minimal Header (Hidden on Print) -->
  <header class="navbar no-print" style="background:#ffffff;">
    <div class="container nav-inner">
      <a href="/index.html" class="brand-logo">
        <span class="logo-icon">🐾</span>
        <span>PetCare<span style="color:var(--primary-600);">Passport</span></span>
      </a>
      <div style="display:flex;gap:10px;">
        <button onclick="window.print()" class="btn btn-primary btn-sm" id="btn-print-passport">
          🖨️ Print Passport / Save PDF
        </button>
        <button onclick="downloadQr()" class="btn btn-outline btn-sm" id="btn-download-qr">
          📥 Download QR Code
        </button>
      </div>
    </div>
  </header>

  <main class="passport-container" id="passport-render-target">
    <div class="text-muted" style="text-align:center;padding:80px;">
      Loading official Digital Pet Passport records...
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    let currentPassportData = null;

    async function loadPassport() {
      const urlParams = new URLSearchParams(window.location.search);
      const publicId = urlParams.get('id');
      const target = document.getElementById('passport-render-target');

      if (!publicId) {
        target.innerHTML = `
          <div class="card" style="text-align:center;padding:48px;">
            <div style="font-size:3rem;margin-bottom:12px;">⚠️</div>
            <h2>Missing Passport Identifier</h2>
            <p class="text-muted">No public ID was provided in the URL.</p>
          </div>
        `;
        return;
      }

      try {
        const res = await API.get(`/api/passports/public/${publicId}`);
        currentPassportData = res.passport;
        renderPassport(res.passport, res.disclaimer);
      } catch (err) {
        target.innerHTML = `
          <div class="card" style="text-align:center;padding:48px;">
            <div style="font-size:3rem;margin-bottom:12px;">🔒</div>
            <h2>Passport Unavailable</h2>
            <p class="text-muted" style="margin-top:8px;">${err.message || 'This digital passport could not be found or has been set to private by its owner.'}</p>
            <div style="margin-top:24px;">
              <a href="/index.html" class="btn btn-outline btn-sm">Return to Home</a>
            </div>
          </div>
        `;
      }
    }

    function renderPassport(p, disclaimer) {
      document.title = `${p.name || 'Pet'} - Digital Pet Passport`;
      const target = document.getElementById('passport-render-target');

      target.innerHTML = `
        <article class="passport-document">
          <!-- Passport Header -->
          <div class="passport-cover-header">
            <div class="passport-title-group">
              <div class="passport-subtitle">Official Digital Pet Identification</div>
              <h1>Pet Passport</h1>
            </div>
            <div class="passport-emblem">🐾</div>
          </div>

          <div class="passport-body">
            <!-- Non-guessable cryptographic public ID -->
            <div class="passport-id-band">
              <span>PASSPORT ID: ${p.public_id}</span>
              <span class="badge badge-approved">VERIFIED FORMAT</span>
            </div>

            <!-- Profile & Photo / QR Layout -->
            <div class="passport-profile-layout">
              <div class="passport-photo-qr-col">
                <div class="passport-photo-frame">
                  <img src="${p.photo_url || '/assets/images/default-pet.jpg'}" alt="${p.name || 'Pet Photo'}">
                </div>
                <div class="passport-qr-box">
                  <img src="${p.qr_code_url}" alt="Passport QR Code" id="passport-qr-img">
                  <div class="passport-qr-caption">Scan for Emergency ID</div>
                </div>
              </div>

              <div>
                <h2 style="font-size:2rem;color:var(--slate-900);margin-bottom:16px;">
                  ${p.name || 'Pet Profile'}
                </h2>

                <div class="passport-details-grid">
                  <div>
                    <div class="passport-field-label">Species</div>
                    <div class="passport-field-value">${p.species || 'Unknown'}</div>
                  </div>
                  <div>
                    <div class="passport-field-label">Breed</div>
                    <div class="passport-field-value">${p.breed || 'Not Disclosed'}</div>
                  </div>
                  <div>
                    <div class="passport-field-label">Sex</div>
                    <div class="passport-field-value">${p.sex || 'Unknown'}</div>
                  </div>
                  <div>
                    <div class="passport-field-label">Spayed / Neutered</div>
                    <div class="passport-field-value">${p.is_sterilized ? 'Yes (Sterilized)' : 'No'}</div>
                  </div>
                  <div>
                    <div class="passport-field-label">Microchip ID</div>
                    <div class="passport-field-value" style="font-family:monospace;">${p.microchip_number || 'Registered'}</div>
                  </div>
                  <div>
                    <div class="passport-field-label">Coat & Markings</div>
                    <div class="passport-field-value">${p.color_marks || 'Standard'}</div>
                  </div>
                </div>

                ${p.emergency_contact ? `
                  <div class="passport-emergency-banner">
                    <h3>🚨 Emergency Contact</h3>
                    <div style="font-size:1.1rem;font-weight:700;color:#991b1b;margin-bottom:4px;">
                      ${p.emergency_contact.name || 'Owner'}
                    </div>
                    ${p.emergency_contact.phone ? `
                      <div style="font-size:1.15rem;font-weight:700;margin-bottom:8px;">
                        📞 <a href="tel:${p.emergency_contact.phone}" style="color:#b91c1c;text-decoration:underline;">${p.emergency_contact.phone}</a>
                      </div>
                    ` : ''}
                    ${p.emergency_contact.notes ? `
                      <p style="font-size:0.9rem;color:#7f1d1d;line-height:1.5;">${p.emergency_contact.notes}</p>
                    ` : ''}
                  </div>
                ` : ''}

                ${p.allergies ? `
                  <div style="margin-top:20px;background:#fef3c7;border-left:4px solid #f59e0b;padding:12px 16px;border-radius:var(--radius-sm);">
                    <div style="font-size:0.8rem;font-weight:700;color:#92400e;text-transform:uppercase;">Critical Allergies</div>
                    <div style="font-weight:600;color:#78350f;">${p.allergies}</div>
                  </div>
                ` : ''}

                ${p.medical_conditions || p.special_care ? `
                  <div style="margin-top:14px;background:var(--slate-50);padding:14px;border-radius:var(--radius-md);border:1px solid var(--slate-200);">
                    <div style="font-size:0.8rem;font-weight:700;color:var(--slate-600);text-transform:uppercase;">Special Handling & Care</div>
                    <div style="font-size:0.925rem;color:var(--slate-800);margin-top:4px;">${p.medical_conditions || ''} ${p.special_care || ''}</div>
                  </div>
                ` : ''}
              </div>
            </div>

            <!-- Vaccinations History (Owner-Authorized) -->
            ${p.vaccinations && p.vaccinations.length > 0 ? `
              <div style="margin-top:32px;border-top:1px solid var(--slate-200);padding-top:24px;">
                <h3 style="font-size:1.25rem;margin-bottom:14px;">💉 Verified Vaccination Summary</h3>
                <div class="table-responsive">
                  <table class="table">
                    <thead>
                      <tr>
                        <th>Vaccine Name</th>
                        <th>Administered</th>
                        <th>Next Due</th>
                        <th>Status</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${p.vaccinations.map(v => `
                        <tr>
                          <td style="font-weight:600;">${v.vaccine_name}</td>
                          <td>${formatDate(v.administered_date)}</td>
                          <td>${formatDate(v.next_due_date)}</td>
                          <td><span class="badge ${v.entry_source === 'clinic_verified' ? 'badge-approved' : 'badge-unknown'}">${v.entry_source === 'clinic_verified' ? 'Clinic Verified' : 'Owner Entered'}</span></td>
                        </tr>
                      `).join('')}
                    </tbody>
                  </table>
                </div>
              </div>
            ` : ''}

            <!-- Bottom Disclaimer -->
            <div class="passport-footer-disclaimer">
              ${disclaimer}
            </div>
          </div>
        </article>
      `;
    }

    function downloadQr() {
      if (!currentPassportData || !currentPassportData.qr_code_url) return;
      const link = document.createElement('a');
      link.download = `${currentPassportData.name || 'pet'}-passport-qr.png`;
      link.href = currentPassportData.qr_code_url;
      link.click();
    }

    document.addEventListener('DOMContentLoaded', loadPassport);
  </script>
</body>
</html>
